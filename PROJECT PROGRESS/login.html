<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ResQHub | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="login.css">
</head>
<body>

<header class="topbar">
  <a href="index.html" class="brand">ResQHub</a>
  <nav class="menu">
    <a href="index.html">Home</a>
    <a href="register.html" class="cta">Register</a>
  </nav>
</header>

<section class="auth">
  <div class="auth-box">
    <h1>Welcome Back</h1>
    <p>Login to access your personalized dashboard</p>

  <form action="login.php" method="POST" id="loginForm">

  <input 
    type="email" 
    id="email" 
    name="email" 
    placeholder="Email Address" 
    required
  >

  <input 
    type="password" 
    id="password" 
    name="password" 
    placeholder="Password" 
    required
  >

  <button type="submit">Login</button>

</form>


    <div class="redirect">
      <span>Don’t have an account?</span>
      <a href="register.html">Create one</a>
    </div>
  </div>
</section>

</body>
</html>
