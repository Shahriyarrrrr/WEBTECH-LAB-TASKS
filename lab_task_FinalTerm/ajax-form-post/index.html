<!DOCTYPE html>
<html>
<head>
    <title>AJAX Form</title>
</head>
<body>

<form id="form">
    <label>Name:</label><br>
    <input type="text" id="name"><br><br>

    <label>Email:</label><br>
    <input type="email" id="email"><br><br>

    <button type="submit">Submit</button>
</form>

<div id="response"></div>

<script>
const f=document.getElementById("form")
const r=document.getElementById("response")

f.onsubmit=e=>{
    e.preventDefault()
    const x=new XMLHttpRequest()
    x.onreadystatechange=()=>{
        if(x.readyState===4){
            if(x.status===200){
                r.innerText=x.responseText
            }else{
                r.innerText="Server error"
            }
        }
    }
    x.open("POST","process_form.php",true)
    x.setRequestHeader("Content-Type","application/x-www-form-urlencoded")
    x.send("name="+encodeURIComponent(name.value)+"&email="+encodeURIComponent(email.value))
}
</script>

</body>
</html>
