<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <style>
        body { font-family: Arial; background:#f2f2f2; }
        .controls { width:90%; margin:20px auto; display:flex; gap:10px; }
        .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:15px; width:90%; margin:auto; }
        .card { background:#fff; padding:15px; cursor:pointer; border-radius:5px; }
        .highlight { border:2px solid green; }
        .details { width:90%; margin:20px auto; background:#fff; padding:20px; display:none; }
        table { width:100%; border-collapse:collapse; }
        th,td { border:1px solid #000; padding:8px; text-align:center; }
    </style>
</head>
<body>

<div class="controls">
    <input type="text" id="search" placeholder="Search by name">
    <select id="semester">
        <option value="">All Semesters</option>
        <option value="Fall 2024">Fall 2024</option>
        <option value="Spring 2024">Spring 2024</option>
    </select>
    <select id="sort">
        <option value="name">Sort by Name</option>
        <option value="gpa">Sort by GPA</option>
    </select>
</div>

<div class="grid" id="students"></div>

<div class="details" id="details"></div>

<script>
fetch("students.json")
.then(r=>r.json())
.then(d=>{
let data=d.students

function render(list){
    const box=document.getElementById("students")
    box.innerHTML=""
    list.forEach(s=>{
        const div=document.createElement("div")
        div.className="card"+(s.gpa>3.5?" highlight":"")
        div.innerHTML=`<h3>${s.name}</h3>Email: ${s.email}<br>GPA: ${s.gpa}<br>Semester: ${s.semester}<br>Courses: ${s.courses.length}`
        div.onclick=()=>details(s)
        box.appendChild(div)
    })
}

function details(s){
    let credits=0
    let grades={A:0,B:0,C:0}
    let rows=s.courses.map(c=>{
        credits+=c.credits
        if(c.grade>=80)grades.A++
        else if(c.grade>=70)grades.B++
        else grades.C++
        return `<tr><td>${c.code}</td><td>${c.name}</td><td>${c.grade}</td><td>${c.credits}</td></tr>`
    }).join("")
    document.getElementById("details").style.display="block"
    document.getElementById("details").innerHTML=
    `<h2>${s.name}</h2>
     <table>
     <tr><th>Code</th><th>Name</th><th>Grade</th><th>Credits</th></tr>
     ${rows}
     </table>
     <p>Total Credits: ${credits}</p>
     <p>Grade Distribution: A=${grades.A}, B=${grades.B}, C=${grades.C}</p>
     <p>GPA: ${s.gpa}</p>`
}

document.getElementById("search").oninput=e=>{
    const v=e.target.value.toLowerCase()
    render(data.filter(s=>s.name.toLowerCase().includes(v)))
}

document.getElementById("semester").onchange=e=>{
    const v=e.target.value
    render(v?data.filter(s=>s.semester===v):data)
}

document.getElementById("sort").onchange=e=>{
    const v=e.target.value
    const sorted=[...data].sort((a,b)=>v==="gpa"?b.gpa-a.gpa:a.name.localeCompare(b.name))
    render(sorted)
}

render(data)
})
</script>

</body>
</html>
